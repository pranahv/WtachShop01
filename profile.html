<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Zone | Luxury Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --primary-gold: #d4af37;
        --dark-gold: #aa8416;
        --bg-dark: #0b0c10;
        --card-bg: rgba(15, 17, 26, 0.85);
        --text-light: #f3f4f6;
        --text-muted: #9ca3af;
        --error-color: #f87171;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Playfair Display', 'Segoe UI', Arial, sans-serif;
    }

    body {
        /* Premium luxury watch background image with dark overlay matching project theme */
        background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.85)), 
                    url('https://images.unsplash.com/photo-1547996160-81dfa63595aa?auto=format&fit=crop&q=80&w=1600') no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        position: relative;
    }

    /* Premium Back Button */
    .back-btn {
        position: absolute;
        top: 25px;
        left: 25px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--primary-gold);
        text-decoration: none;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        padding: 10px 18px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 30px;
        background: rgba(11, 12, 16, 0.6);
        backdrop-filter: blur(5px);
        transition: all 0.3s ease;
    }

    .back-btn:hover {
        background: var(--primary-gold);
        color: var(--bg-dark);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        transform: translateX(-3px);
    }

    /* Container Card */
    .profile-container {
        width: 450px;
        background: var(--card-bg);
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgba(212, 175, 55, 0.15);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        text-align: center;
    }

    .brand-logo {
        color: var(--primary-gold);
        font-size: 28px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    h2 {
        margin-bottom: 30px;
        color: var(--text-light);
        font-size: 18px;
        font-weight: 300;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* Premium Profile Image Circular Frame */
    .profile-img-wrapper {
        position: relative;
        width: 140px;
        height: 140px;
        margin: 0 auto 25px auto;
    }

    .profile-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--primary-gold);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    /* Default Icon if no photo exists */
    .profile-icon-placeholder {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(212, 175, 55, 0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text-muted);
        font-size: 50px;
    }

    /* Info Block Styling */
    .info {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
        text-align: left;
    }

    .info p {
        margin: 12px 0;
        color: var(--text-light);
        font-size: 14px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 8px;
    }

    .info p:last-child {
        border-bottom: none;
        padding-bottom: 0;
    }

    .info p i {
        color: var(--primary-gold);
        width: 25px;
        font-size: 14px;
    }

    .info b {
        color: var(--text-muted);
        font-weight: 400;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 1px;
        width: 80px;
        display: inline-block;
    }

    /* Button Group Styling */
    .btn-group {
        display: flex;
        gap: 15px;
    }

    .btn {
        flex: 1;
        padding: 12px;
        text-decoration: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: all 0.3s ease;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    /* Premium Gold Edit Button */
    .edit-btn {
        background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
        color: var(--bg-dark);
        border: none;
    }

    .edit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        opacity: 0.95;
    }

    /* Premium Luxury Dark-Red Logout Button */
    .logout-btn {
        background: transparent;
        color: var(--error-color);
        border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .logout-btn:hover {
        background: rgba(248, 113, 113, 0.1);
        border-color: var(--error-color);
        transform: translateY(-2px);
    }
</style>
</head>
<body>

<a href="{% url 'home' %}" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> 
</a>

<div class="profile-container">
    <div class="brand-logo">WATCH ZONE</div>
    <h2>Collection Profile</h2>

    <div class="profile-img-wrapper">
        {% if user.Image %}
            <img src="{{ user.Image.url }}" class="profile-img" alt="Profile Image">
        {% else %}
            <div class="profile-icon-placeholder">
                <i class="fa-solid fa-user-tie"></i>
            </div>
        {% endif %}
    </div>

    <div class="info">
        <p>
            <i class="fa-solid fa-user"></i>
            <b>Name</b> {{ user.Name }}
        </p>

        <p>
            <i class="fa-solid fa-envelope"></i>
            <b>Email</b> {{ user.Email }}
        </p>

        <p>
            <i class="fa-solid fa-phone"></i>
            <b>Phone</b> {{ user.Phone }}
        </p>

        <p>
            <i class="fa-solid fa-calendar-days"></i>
            <b>DOB</b> {{ user.DOB }}
        </p>
    </div>

    <div class="btn-group">
        <a href="{% url 'editprofile' %}" class="btn edit-btn">
            <i class="fa-solid fa-pen-to-square"></i> Edit Profile
        </a>

        <a href="{% url 'logout_view' %}" class="btn logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </div>
</div>

</body>
</html>
