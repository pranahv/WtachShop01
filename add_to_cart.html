<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add To Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f8f6f0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.cart-box{
    width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    text-align:center;
}

.cart-box img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:15px;
    border:3px solid #d4af37;
    margin-bottom:20px;
}

h1{
    color:#111;
    margin-bottom:15px;
}

.price{
    color:#d4af37;
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
}

.info{
    color:#555;
    font-size:16px;
    margin-bottom:10px;
}

.btn-group{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
}

.btn{
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;
    color:white;
    font-size:16px;
    font-weight:bold;
    transition:0.3s;
}

.add-btn{
    background:#111;
}

.add-btn:hover{
    background:#d4af37;
    color:#111;
}

.back-btn{
    background:#666;
}

.back-btn:hover{
    background:#444;
}

</style>
</head>

<body>

<div class="cart-box">

    <img src="{{ watch.image.url }}" alt="{{ watch.model_name }}">

    <h1>{{ watch.brand }} {{ watch.model_name }}</h1>

    <div class="info">
        Dial Color : {{ watch.dial_color }}
    </div>

    <div class="price">
        ₹{{ watch.price }}
    </div>

    <div class="info">
        {{ watch.description }}
    </div>

    <div class="btn-group">

        <a href="{% url 'add_to_cart' watch.id %}" class="btn add-btn">
            Add To Cart
        </a>

        <a href="{% url 'product' %}" class="btn back-btn">
            Back
        </a>

    </div>

</div>

</body>
</html>
